name: HARMONIE cloud + wind/precip + stations data feed

# Frequent low-latency feed for Iceland, every 3-hourly model run:
#   * dmi_latest.json      DMI HARMONIE IG 2 km, numeric cloud layers + visibility (preferred)
#   * harmonie_latest.json vedur images of the same model (automatic backup in the app)
#   * elements_latest.json vedur wind/precip, vedur_stations.json station forecasts
# Probes first: vedur and DMI are each extracted only when they have a run newer than the one
# published, so the 30-min Worker dispatches cost seconds when nothing changed. `force` re-extracts.

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-extract vedur + DMI even if their newest runs are already published'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SITE: https://avengingab1.github.io/iceland-sky-data

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r harmonie/requirements.txt

      # Lightweight probe: is vedur.is reachable and does it have a newer HARMONIE run?
      - name: Probe vedur.is for new data
        id: probe
        env:
          FORCE: ${{ inputs.force }}
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          CURRENT_RUN=$(curl -sf "$SITE/harmonie_latest.json" | python3 -c "import sys,json; print(json.load(sys.stdin).get('run',''))" 2>/dev/null || echo "")
          echo "current_run=$CURRENT_RUN"
          python3 -c "
          import requests, datetime as dt, sys
          now = dt.datetime.utcnow()
          BASE = 'https://www.vedur.is/media/vedurstofan/vefkort/spar/harmonielysingar/harmonie_island_lcc/'
          for back in range(0, 8):
              t = now - dt.timedelta(hours=3*back)
              run = t.strftime('%y%m%d') + '_%02d00' % (3*(t.hour//3))
              try:
                  r = requests.head(BASE + run + '_6.png', timeout=10)
                  if r.status_code == 200:
                      print(run)
                      sys.exit(0)
              except Exception: pass
          print('UNREACHABLE')
          " > /tmp/latest_run.txt
          LATEST_RUN=$(cat /tmp/latest_run.txt)
          echo "latest_run=$LATEST_RUN"
          if [ "$FORCE" = "true" ]; then
            echo "Forced — full vedur extract"
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$LATEST_RUN" = "UNREACHABLE" ]; then
            echo "vedur.is unreachable — skipping vedur extract"
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [ "$LATEST_RUN" = "$CURRENT_RUN" ]; then
            echo "No new vedur run (still $CURRENT_RUN)"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "New vedur run: $LATEST_RUN (was: $CURRENT_RUN)"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # DMI numeric HARMONIE IG: probe + extract in one step (exit 3 = newest complete run is
      # already published, 4 = DMI unreachable). Never fails the job: vedur still publishes.
      - name: Extract DMI HARMONIE IG (numeric clouds + visibility)
        id: dmi
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force }}
        run: |
          CURRENT=$(curl -sf "$SITE/dmi_latest.json" | python3 -c "import sys,json; print(json.load(sys.stdin).get('run',''))" 2>/dev/null || echo "")
          echo "published DMI run: '$CURRENT'"
          SKIP_ARG=""
          if [ "$FORCE" != "true" ] && [ -n "$CURRENT" ]; then SKIP_ARG="--skip-if-run $CURRENT"; fi
          set +e
          python harmonie/extract_dmi_ig.py --out _site/dmi_latest.json $SKIP_ARG
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then echo "new=true" >> $GITHUB_OUTPUT; else echo "new=false" >> $GITHUB_OUTPUT; rm -f _site/dmi_latest.json; fi
          if [ $rc -eq 4 ]; then echo "::warning::DMI open data unreachable - kept the published DMI run"; fi
          if [ $rc -ne 0 ] && [ $rc -ne 3 ] && [ $rc -ne 4 ]; then echo "::warning::DMI extract failed (rc=$rc) - kept the published DMI run"; fi
          exit 0

      - name: Carry recent past hours forward (DMI)
        if: steps.dmi.outputs.new == 'true'
        continue-on-error: true
        run: python harmonie/carry_forward.py --new _site/dmi_latest.json --prev-url "$SITE/dmi_latest.json" --hours 30

      - name: Extract HARMONIE cloud grids
        if: steps.probe.outputs.skip != 'true'
        run: |
          python harmonie/extract.py --out _site/harmonie_latest.json
          ls -lh _site

      # Keep the last ~30 h of PAST hours (newest run per hour) that the new run no longer
      # covers, so a late Fetch still gets e.g. this evening's 15Z/18Z data, not a days-old run.
      - name: Carry recent past hours forward
        if: steps.probe.outputs.skip != 'true'
        continue-on-error: true
        run: |
          python harmonie/carry_forward.py --new _site/harmonie_latest.json --prev-url "$SITE/harmonie_latest.json" --hours 30
          ls -lh _site

      - name: Extract wind/precip (thattaspa) grids
        if: steps.probe.outputs.skip != 'true'
        continue-on-error: true
        run: |
          python harmonie/extract_elements.py --out _site/elements_latest.json || true
          ls -lh _site

      - name: Extract Vedur station forecasts
        if: steps.probe.outputs.skip != 'true'
        continue-on-error: true
        run: |
          python harmonie/extract_stations.py --out _site/vedur_stations.json || true
          ls -lh _site

      - name: Decide whether to publish
        id: pub
        run: |
          if [ "${{ steps.probe.outputs.skip }}" != "true" ] || [ "${{ steps.dmi.outputs.new }}" = "true" ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT; echo "Nothing new from vedur or DMI"
          fi

      # Every deploy replaces the whole site: copy every feed file this run did not produce
      # from the live site (single list for all workflows of this repo).
      - name: Preserve the other feed files from the current deploy
        if: steps.pub.outputs.deploy == 'true'
        run: |
          for f in harmonie_latest.json dmi_latest.json elements_latest.json vedur_stations.json meteo_latest.json ecmwf_latest.json ecmwf_elements_latest.json; do
            if [ ! -f "_site/$f" ]; then
              curl -sf "$SITE/$f" -o "_site/$f.tmp" && mv "_site/$f.tmp" "_site/$f" && echo "preserved $f" || { rm -f "_site/$f.tmp"; echo "no existing $f"; }
            fi
          done
          ls -lh _site

      - uses: actions/upload-pages-artifact@v3
        if: steps.pub.outputs.deploy == 'true'
        with:
          path: _site

      - id: deployment
        if: steps.pub.outputs.deploy == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # GitHub's Pages API occasionally fails transiently ("Fetching artifact metadata failed",
      # "Failed to create deployment (status: 500)") although the artifact is fine. Retry once
      # after a minute instead of failing the run; the job only fails if the retry fails too.
      - name: Wait before retrying a failed Pages deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4