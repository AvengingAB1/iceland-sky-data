name: Open-Meteo cloud + fog grid (14-day, 22km)

# Separate from the fast HARMONIE workflow. Runs twice a day, ~20 min after ECMWF IFS's 00Z/12Z
# runs reach Open-Meteo (~6.2 h after init; best_match here IS ecmwf_ifs from day 3, and only the
# 00Z/12Z runs reach 15 days). 2 x 2304 points = 4608 calls/day; Norway runs an hour later so the
# two feeds together stay under Open-Meteo's free limits (10000/day, 5000/hour). A run skips itself
# (no API calls) if the published grid is < 5 h old, so an extra trigger can't double-spend.
# Takes ~11 min (paced requests). Own concurrency group so HARMONIE deploys can't cancel it.

on:
  schedule:
    - cron: '30 6,18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if the published grid is less than 5 h old (uses API calls)'
        type: boolean
        default: false
      only_ecmwf:
        description: 'Only refresh the ECMWF 9 km files (no Open-Meteo API calls)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: meteo-extract
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SITE: https://avengingab1.github.io/iceland-sky-data

jobs:
  extract-meteo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Skip if the published grid is still fresh (saves API calls)
        id: fresh
        env:
          FORCE: ${{ inputs.force || inputs.only_ecmwf }}
        run: |
          if [ "$FORCE" = "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; echo "forced run"; exit 0; fi
          AGE_H=$(curl -sf "$SITE/meteo_latest.json" | python3 -c "import sys,json,datetime as d; g=json.load(sys.stdin)['generated']; t=d.datetime.strptime(g[:16],'%Y-%m-%dT%H:%M').replace(tzinfo=d.timezone.utc); print(int((d.datetime.now(d.timezone.utc)-t).total_seconds()//3600))" 2>/dev/null || echo 999)
          echo "published grid age: ${AGE_H} h"
          if [ "$AGE_H" -lt 5 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "still fresh: skipping (no API calls)"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v5
        if: steps.fresh.outputs.skip != 'true'

      - uses: actions/setup-python@v6
        if: steps.fresh.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.fresh.outputs.skip != 'true'
        run: pip install requests

      # Non-fatal: a failure keeps the published meteo_latest.json and ECMWF still publishes.
      - name: Extract Open-Meteo cloud + fog grid
        if: steps.fresh.outputs.skip != 'true' && inputs.only_ecmwf != true
        continue-on-error: true
        run: |
          mkdir -p _site
          python harmonie/extract_meteo.py --out _site/meteo_latest.json
          touch _site/.nojekyll
          ls -lh _site

      # ECMWF IFS 9 km long range (clouds, visibility, wind, precip to +15 days) from Open-Meteo's
      # open S3 bucket: no API calls. Optional: a failure keeps the published ECMWF files.
      - name: Extract ECMWF 9 km long-range grid + wind/precip overlays
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        run: |
          pip install omfiles fsspec s3fs numpy scipy Pillow
          mkdir -p _site
          (cd harmonie && python extract_ecmwf.py --region iceland --out ../_site/ecmwf_latest.json --elements-out ../_site/ecmwf_elements_latest.json)
          ls -lh _site

      # Every deploy replaces the whole site: copy every feed file this run did not produce
      # from the live site (single list for all workflows of this repo).
      - name: Preserve the other feed files from the current deploy
        if: steps.fresh.outputs.skip != 'true'
        run: |
          for f in harmonie_latest.json dmi_latest.json elements_latest.json vedur_stations.json meteo_latest.json ecmwf_latest.json ecmwf_elements_latest.json; do
            if [ ! -f "_site/$f" ]; then
              curl -sf "$SITE/$f" -o "_site/$f.tmp" && mv "_site/$f.tmp" "_site/$f" && echo "preserved $f" || { rm -f "_site/$f.tmp"; echo "no existing $f"; }
            fi
          done
          ls -lh _site

      - uses: actions/upload-pages-artifact@v3
        if: steps.fresh.outputs.skip != 'true'
        with:
          path: _site

      - id: deployment
        if: steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # GitHub's Pages API occasionally fails transiently ("Fetching artifact metadata failed",
      # "Failed to create deployment (status: 500)") although the artifact is fine. Retry once
      # after a minute instead of failing the run; the job only fails if the retry fails too.
      - name: Wait before retrying a failed Pages deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
